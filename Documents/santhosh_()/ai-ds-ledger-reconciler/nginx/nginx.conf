# =============================================================================
#  Nginx — Round-Robin Load Balancer for the agent-app cluster
# =============================================================================
#  Why the `resolver` + variable-in-proxy_pass trick?
#  -----------------------------------------------------
#  When you `--scale agent-app=3`, Docker's embedded DNS server (127.0.0.11)
#  resolves the name `agent-app` to ALL three replica IPs, in rotating order.
#  A classic `upstream { server agent-app:3000; }` block resolves that name
#  exactly ONCE at startup and pins to a single IP forever -> no balancing.
#
#  By putting the backend in a *variable* and configuring the Docker resolver,
#  nginx re-resolves the name on every request and rotates across the live
#  replicas => true round-robin that automatically tracks scaling up/down.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. `valid=5s` re-checks replica IPs every 5s so the
    # LB picks up containers added/removed by `--scale`.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Custom log line so you can SEE which backend served each request.
    log_format  lb_log  '$remote_addr -> [$upstream_addr] "$request" '
                        'status=$status instance=$upstream_http_x_instance_name '
                        '${request_time}s';

    access_log /var/log/nginx/access.log lb_log;

    server {
        listen 80;

        location / {
            # Backend in a variable => forces per-request DNS resolution.
            set $backend "agent-app:3000";
            proxy_pass http://$backend$request_uri;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Surface routing info to the client:
            #  - X-Instance-Name is set by the NestJS app (os.hostname() of the
            #    replica that handled the request) and forwarded through here.
            #  - X-Upstream-Addr is the backend IP:port nginx routed to.
            proxy_pass_header X-Instance-Name;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
